[package]
name = "fluux-nse-openpgp"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
[lib]
crate-type = ["staticlib", "rlib"]
[dependencies]
sequoia-openpgp = { version = "=2.4.1", default-features = false, features = ["crypto-rust", "compression-deflate", "allow-experimental-crypto", "allow-variable-time-crypto"] }
anyhow = "=1.0.104"
base64 = "=0.23.1"
quick-xml = "=0.38.4"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webpki-roots = "1"
[features]
synthetic-lab = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
