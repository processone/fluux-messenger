[package]
name = "tauri-plugin-push"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-push"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSArray", "NSString", "NSDate", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotification", "block2"] }
